<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motiv</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#111126}main{max-width:450px;margin:auto;min-height:100dvh;padding:24px 24px 90px;background:#faf9fd;color:#181529}main.home{color:white;background:linear-gradient(180deg,#15152f,#51405f 35%,#111128 80%)}header{text-align:center;font-size:34px;font-weight:850;font-style:italic;margin:12px 0 35px}header span{color:#9255ff}h1{font-size:34px;letter-spacing:-1.5px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,textarea,button{font:inherit;border-radius:14px;padding:13px;border:1px solid #aaa5;background:#8881;color:inherit;width:100%}button{cursor:pointer;font-weight:600}.primary{background:linear-gradient(100deg,#5940f5,#a640e9);color:white;border:0;margin-top:18px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(450px,100%);display:flex;background:#fff;color:#27233a;border-top:1px solid #ddd;padding:8px}nav button{border:0;background:none;font-size:12px}article{background:white;border-radius:22px;box-shadow:0 8px 30px #21163b18;overflow:hidden;padding:18px;touch-action:pan-y}img{width:100%;border-radius:14px}.row{display:flex;gap:12px}.muted{opacity:.65;font-size:13px}.tile{padding:15px;border:1px solid #ddd;border-radius:15px;margin:10px 0}.actions button{font-size:26px;border-radius:50%;width:64px;height:64px}.actions{justify-content:center;margin-top:20px}</style><main id="m"><header><span>◢◢</span> Motiv</header><section id="s"></section><nav><button onclick="home()">⌂<br>Home</button><button onclick="discover()">◇<br>Discover</button><button onclick="favorites()">♡<br>Saved</button><button onclick="compare()">⇄<br>Compare</button><button onclick="more()">☰<br>More</button></nav></main><script>const s=document.querySelector('#s'),m=document.querySelector('#m');let cars=[],i=0,max=90000,saved=JSON.parse(localStorage.getItem('motivSaved')||'[]'),feedback=JSON.parse(localStorage.getItem('motivFeedback')||'[]');function page(h,body,home=false){m.className=home?'home':'';s.innerHTML='<h1>'+h+'</h1>'+body}function home(){page('Let’s find<br>your next car.','<p>Tell us what you’re looking for.</p><label>Budget</label><select id="budget"><option value="90000">Up to $90,000</option><option value="30000">Up to $30,000</option><option value="60000">Up to $60,000</option><option value="150000">Up to $150,000</option></select><label>Vehicle type</label><select id="type"><option>Any</option><option>SUV</option><option>Sedan</option><option>Truck</option></select><label>Anything else?</label><input id="pref" placeholder="Make, model or features"><button class="primary" onclick="search()">Find My Matches →</button>',true)}async function search(){max=+document.querySelector('#budget').value;let p=document.querySelector('#pref').value.toLowerCase();page('Finding matches…','');try{let r=await fetch('/api/inventory?max='+max),j=await r.json();if(!r.ok)throw Error(j.error||'Inventory unavailable');cars=j.vehicles.sort((a,b)=>Number(JSON.stringify(b).toLowerCase().includes(p))-Number(JSON.stringify(a).toLowerCase().includes(p)));i=0;discover()}catch(e){page('Inventory coming soon','<p>Dealer feeds are not connected yet.</p><button onclick="home()">Back to search</button>')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function discover(){let v=cars[i];if(!v)return page('Discover','<p>No vehicles loaded. Start a search to find matches.</p><button onclick="home()">Search</button>');page('Discover','<article id="card">'+(/^https:\/\//.test(v.photo)?'<img src="'+esc(v.photo)+'">':'')+'<h2>'+esc(v.year+' '+v.make+' '+v.model)+'</h2><p>$'+Number(v.price).toLocaleString()+' · '+esc(v.mileage)+' mi</p><p>'+esc(v.dealer)+'</p></article><div class="row actions"><button onclick="vote(false)">×</button><button class="primary" onclick="vote(true)">♥</button></div>');let c=document.querySelector('#card'),x;c.onpointerdown=e=>{x=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(x!==undefined)c.style.transform='translateX('+(e.clientX-x)+'px) rotate('+((e.clientX-x)/15)+'deg)'};c.onpointerup=e=>{let d=e.clientX-x;x=undefined;c.style.transform='';if(Math.abs(d)>70)vote(d>0)}}function vote(l){if(l){let v=cars[i];if(!saved.some(a=>a.vin===v.vin))saved.push(v);localStorage.setItem('motivSaved',JSON.stringify(saved));i++;page('Matched!','<div style="text-align:center;font-size:80px;color:#9045ee">♥</div><button class="primary" onclick="discover()">Keep swiping →</button><button onclick="favorites()">View favorites</button><button onclick="compare()">Compare vehicles</button>')}else{i++;discover()}}function favorites(){page('Saved',saved.map(v=>'<div class="tile">'+esc(v.year+' '+v.make+' '+v.model)+'<p>$'+Number(v.price).toLocaleString()+'</p></div>').join('')||'<p>No saved vehicles yet.</p>')}function compare(){page('Compare',saved.length<2?'<p>Save two vehicles to compare.</p>':'<div class="row">'+saved.slice(0,2).map(v=>'<article>'+esc(v.make+' '+v.model)+'<p>$'+Number(v.price).toLocaleString()+'</p><p>'+esc(v.mileage)+' miles</p></article>').join('')+'</div>')}function more(){page('More','<button onclick="shape()">Shape Motiv →</button><p class="muted">No account required.</p>')}function shape(){page('Shape Motiv','<p>Help us build a better way to shop for cars.</p><select id="kind"><option>Feature suggestion</option><option>Bug report</option></select><textarea id="idea" placeholder="What should we improve?"></textarea><button class="primary" onclick="submitIdea()">Save feedback</button><p class="muted">Prototype: feedback and votes are saved on this device only.</p>'+feedback.map((f,k)=>'<div class="tile">'+esc(f.kind)+': '+esc(f.idea)+'<p>Saved locally · '+f.votes+' votes</p><button onclick="up('+k+')">↑ Upvote</button></div>').join('')+'<h2>Changelog</h2><p>Feedback prototype added.</p>')}function submitIdea(){let idea=document.querySelector('#idea').value.trim();if(!idea)return;feedback.push({idea,kind:document.querySelector('#kind').value,votes:0});store()}function up(k){if(!feedback[k].voted){feedback[k].votes++;feedback[k].voted=true;store()}}function store(){localStorage.setItem('motivFeedback',JSON.stringify(feedback));shape()}home()</script>
