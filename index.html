<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motiv</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#111126}main{max-width:450px;margin:auto;min-height:100dvh;padding:24px 24px 90px;background:#faf9fd;color:#181529}main.home{color:white;background:linear-gradient(180deg,#15152f,#51405f 35%,#111128 80%)}header{text-align:center;font-size:34px;font-weight:850;font-style:italic;margin:12px 0 35px}header span{color:#9255ff}h1{font-size:34px;letter-spacing:-1.5px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,textarea,button{font:inherit;border-radius:14px;padding:13px;border:1px solid #aaa5;background:#8881;color:inherit;width:100%}button{cursor:pointer;font-weight:600}.primary{background:linear-gradient(100deg,#5940f5,#a640e9);color:white;border:0;margin-top:18px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(450px,100%);display:flex;background:#fff;color:#27233a;border-top:1px solid #ddd;padding:8px}nav button{border:0;background:none;font-size:12px}article{background:white;border-radius:22px;box-shadow:0 8px 30px #21163b18;overflow:hidden;padding:18px;touch-action:pan-y}img{width:100%;border-radius:14px}.row{display:flex;gap:12px}.muted{opacity:.65;font-size:13px}.tile{padding:15px;border:1px solid #ddd;border-radius:15px;margin:10px 0}.actions button{font-size:26px;border-radius:50%;width:64px;height:64px}.actions{justify-content:center;margin-top:20px}</style><style>main{position:relative;max-width:440px;padding:22px 24px 90px;background:#f8f7fc}main.home{background:linear-gradient(180deg,transparent 0%,#10102400 25%,#101024ed 48%,#0b0b20 78%),url('/mountains.svg') center top/100% auto no-repeat,#101024}header{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;letter-spacing:-1.6px;margin:14px 0 48px;font-weight:850}header .mark{display:flex;gap:4px;transform:skew(-27deg)}header .mark i{width:13px;height:29px;border-radius:4px;background:linear-gradient(135deg,#b34df5,#5830ff)}header .mark i+ i{background:linear-gradient(135deg,#d253ed,#852aff)}h1{font-size:34px;line-height:1.1;margin:0 0 12px}p{line-height:1.45}label{font-size:14px;margin:15px 0 6px}input,select,textarea{height:46px;border-radius:17px;background:#ffffff14;border:1px solid #ffffff32}select option{color:#171526}textarea{height:90px}.primary{border-radius:30px;background:linear-gradient(105deg,#4930ff,#a52de9,#d24ce9);min-height:49px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;font-size:13px;padding:8px 13px;border-radius:22px;border:1px solid #ffffff40;background:transparent}.chips .selected{background:linear-gradient(105deg,#4930ff,#c345e9)}nav{background:#faf9fdee;backdrop-filter:blur(20px);padding:8px 5px 12px}main.home nav{background:#0b0b20ee;color:#fff;border-color:#ffffff16}nav button{font-size:11px;line-height:1.4;padding:3px}nav svg{display:block;margin:0 auto 3px;width:24px;height:24px}nav button:first-child{color:#8b40f4}article{padding:0;background:#252334;color:white;overflow:hidden;border-radius:23px}article img{display:block;width:100%;height:310px;object-fit:cover;border-radius:0}article h2,article p{margin:12px 17px}article p:last-child{padding-bottom:12px}.actions button{background:white;color:#652af1;box-shadow:0 6px 18px #30205625;border:0}.actions .primary{background:linear-gradient(135deg,#a444f7,#5020f5);color:white;margin:0}.tile{background:#fff}main.home h1{margin-top:5px}main.home header{margin-bottom:62px}</style><main id="m"><header><span class="mark"><i></i><i></i></span>Motiv</header><section id="s"></section><nav><button onclick="home()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3z"/></svg>Home</button><button onclick="favorites()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>Saved</button><button onclick="compare()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3v18M5 21h14M3 7h18M6 7l-4 8h8zM18 7l-4 8h8z"/></svg>Compare</button><button onclick="more()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>More</button></nav></main><script>const s=document.querySelector('#s'),m=document.querySelector('#m');let cars=[],i=0,max=90000,saved=JSON.parse(localStorage.getItem('motivSaved')||'[]'),feedback=JSON.parse(localStorage.getItem('motivFeedback')||'[]');function page(h,body,home=false){m.className=home?'home':'';s.innerHTML='<h1>'+h+'</h1>'+body}function home(){page('Let’s find<br>your next car.','<p>Tell us what you’re looking for,<br>and we’ll show you the perfect matches.</p><label>Budget</label><select id="budget"><option value="90000">Up to $90,000</option><option value="30000">Up to $30,000</option><option value="60000">Up to $60,000</option><option value="150000">Up to $150,000</option></select><label>Vehicle type</label><select id="type"><option>Any</option><option>SUV</option><option>Sedan</option><option>Truck</option></select><label>Must-have features (optional)</label><div class="chips"><button onclick="this.classList.toggle(&quot;selected&quot;)">AWD</button><button onclick="this.classList.toggle(&quot;selected&quot;)">Heated Seats</button><button onclick="this.classList.toggle(&quot;selected&quot;)">Apple CarPlay</button><button onclick="this.classList.toggle(&quot;selected&quot;)">3rd Row</button><button onclick="this.classList.toggle(&quot;selected&quot;)">Sunroof</button></div><label>Anything else?</label><input id="pref" placeholder="Make, model or features"><button class="primary" onclick="search()">Find My Matches →</button>',true)}async function search(){max=+document.querySelector('#budget').value;let p=document.querySelector('#pref').value.toLowerCase();page('Finding matches…','');try{let r=await fetch('/api/inventory?max='+max),j=await r.json();if(!r.ok)throw Error(j.error||'Inventory unavailable');cars=j.vehicles.sort((a,b)=>Number(JSON.stringify(b).toLowerCase().includes(p))-Number(JSON.stringify(a).toLowerCase().includes(p)));i=0;discover()}catch(e){page('Inventory coming soon','<p>Dealer feeds are not connected yet.</p><button onclick="home()">Back to search</button>')}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function discover(){let v=cars[i];if(!v)return page('Discover','<p>No vehicles loaded. Start a search to find matches.</p><button onclick="home()">Search</button>');page('Discover','<article id="card">'+(/^https:\/\//.test(v.photo)?'<img src="'+esc(v.photo)+'">':'')+'<h2>'+esc(v.year+' '+v.make+' '+v.model)+'</h2><p>$'+Number(v.price).toLocaleString()+' · '+esc(v.mileage)+' mi</p><p>'+esc(v.dealer)+'</p></article><div class="row actions"><button onclick="vote(false)">×</button><button class="primary" onclick="vote(true)">♥</button></div>');let c=document.querySelector('#card'),x;c.onpointerdown=e=>{x=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(x!==undefined)c.style.transform='translateX('+(e.clientX-x)+'px) rotate('+((e.clientX-x)/15)+'deg)'};c.onpointerup=e=>{let d=e.clientX-x;x=undefined;c.style.transform='';if(Math.abs(d)>70)vote(d>0)}}function vote(l){if(l){let v=cars[i];if(!saved.some(a=>a.vin===v.vin))saved.push(v);localStorage.setItem('motivSaved',JSON.stringify(saved));i++;page('Matched!','<div style="text-align:center;font-size:80px;color:#9045ee">♥</div><button class="primary" onclick="discover()">Keep swiping →</button><button onclick="favorites()">View favorites</button><button onclick="compare()">Compare vehicles</button>')}else{i++;discover()}}function favorites(){page('Saved',saved.map(v=>'<div class="tile">'+esc(v.year+' '+v.make+' '+v.model)+'<p>$'+Number(v.price).toLocaleString()+'</p></div>').join('')||'<p>No saved vehicles yet.</p>')}function compare(){page('Compare',saved.length<2?'<p>Save two vehicles to compare.</p>':'<div class="row">'+saved.slice(0,2).map(v=>'<article>'+esc(v.make+' '+v.model)+'<p>$'+Number(v.price).toLocaleString()+'</p><p>'+esc(v.mileage)+' miles</p></article>').join('')+'</div>')}function more(){page('More','<button onclick="shape()">Shape Motiv →</button><p class="muted">No account required.</p>')}function shape(){page('Shape Motiv','<p>Help us build a better way to shop for cars.</p><select id="kind"><option>Feature suggestion</option><option>Bug report</option></select><textarea id="idea" placeholder="What should we improve?"></textarea><button class="primary" onclick="submitIdea()">Save feedback</button><p class="muted">Prototype: feedback and votes are saved on this device only.</p>'+feedback.map((f,k)=>'<div class="tile">'+esc(f.kind)+': '+esc(f.idea)+'<p>Saved locally · '+f.votes+' votes</p><button onclick="up('+k+')">↑ Upvote</button></div>').join('')+'<h2>Changelog</h2><p>Feedback prototype added.</p>')}function submitIdea(){let idea=document.querySelector('#idea').value.trim();if(!idea)return;feedback.push({idea,kind:document.querySelector('#kind').value,votes:0});store()}function up(k){if(!feedback[k].voted){feedback[k].votes++;feedback[k].voted=true;store()}}function store(){localStorage.setItem('motivFeedback',JSON.stringify(feedback));shape()}home()</script>
